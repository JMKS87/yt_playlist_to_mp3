services:
  yt2mp3:
    build: .
    image: yt2mp3
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - ${OUTPUT_DIR:-./output}:/data/output
      - ./config:/data/config
    environment:
      TZ: Europe/Warsaw
      OUTPUT_ROOT: /data/output
      DB_PATH: /data/config/app.db
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
